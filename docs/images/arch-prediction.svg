m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="390" rx="10"/><g class="teal"><rect class="f" x="60" y="24" width="170" height="40" rx="8"/><text class="th tt" x="145.0" y="44.0" text-anchor="middle" dominant-baseline="central">Client (player 1)</text></g><g class="purple"><rect class="f" x="450" y="24" width="170" height="40" rx="8"/><text class="th tt" x="535.0" y="44.0" text-anchor="middle" dominant-baseline="central">Server (authority)</text></g><path class="ln dash" d="M240 70 L240 366"/><path class="ln dash" d="M440 70 L440 366"/><g class="teal"><rect class="f" x="40" y="86" width="190" height="48" rx="8"/><text class="th tt" x="135.0" y="100.0" text-anchor="middle" dominant-baseline="central">Tick 101: W pressed</text><text class="ts st" x="135.0" y="120.0" text-anchor="middle" dominant-baseline="central">moves on screen at once</text></g><path class="l-teal" d="M242 100 L438 140" marker-end="url(#a-teal)"/><text class="ts" x="340" y="104" text-anchor="middle" dominant-baseline="central">Input [101]</text><g class="teal"><rect class="f" x="40" y="156" width="190" height="48" rx="8"/><text class="th tt" x="135.0" y="170.0" text-anchor="middle" dominant-baseline="central">Tick 102</text><text class="ts st" x="135.0" y="190.0" text-anchor="middle" dominant-baseline="central">resends 101 with 102</text></g><path class="l-teal" d="M242 170 L438 210" marker-end="url(#a-teal)"/><text class="ts" x="340" y="174" text-anchor="middle" dominant-baseline="central">Input [101, 102]</text><g class="purple"><rect class="f" x="450" y="130" width="190" height="48" rx="8"/><text class="th tt" x="545.0" y="144.0" text-anchor="middle" dominant-baseline="central">Applies input 101</text><text class="ts st" x="545.0" y="164.0" text-anchor="middle" dominant-baseline="central">simulate, then snapshot</text></g><path class="l-purple" d="M438 236 L242 290" marker-end="url(#a-purple)"/><text class="ts" x="432" y="222" text-anchor="end" dominant-baseline="central">Snapshot (ack 101)</text><g class="teal"><rect class="f" x="40" y="282" width="190" height="70" rx="8"/><text class="th tt" x="135.0" y="307.0" text-anchor="middle" dominant-baseline="central">Reconcile</text><text class="ts st" x="135.0" y="327.0" text-anchor="middle" dominant-baseline="central">world = snapshot,</text></g><g class="teal"><text class="ts st" x="135" y="338" text-anchor="middle" dominant-baseline="central">replay 102 onward</text></g></svg>
