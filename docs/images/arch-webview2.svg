<svg xmlns="http://www.w3.org/2000/svg" width="680" height="420" viewBox="0 0 680 420" role="img"><title>scraps_web: the UI layer</title><desc>Native side: ClientApp runs the game; the webview2 backend turns Renderer2D calls into one frame of bytes in a shared buffer, sends small JSON view messages through UiHost, and receives UI actions and page input. Page side: renderer.js draws the frame with WebGL2 on the world canvas, React draws menus and HUD on top and sends actions; Esc belongs to the page.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill:#5F5E5A}.x-gray{fill:#5F5E5A}.blue .f{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.8}.blue .ff{fill:#185FA5}.blue .tt{fill:#0C447C}.blue .st{fill:#185FA5}.l-blue{stroke:#185FA5;fill:none;stroke-width:1.6}.m-blue{fill:#185FA5}.x-blue{fill:#185FA5}@media (prefers-color-scheme: dark){.bg{fill:#1F1F1E}text{fill:#E8E6DE}.ts{fill:#B4B2A9}.ln{stroke:#9C9A92}.mk{fill:#9C9A92}.frame{stroke:#5F5E5A}.purple .f{fill:#3C3489;stroke:#AFA9EC}.purple .ff{fill:#AFA9EC}.purple .tt{fill:#CECBF6}.purple .st{fill:#AFA9EC}.l-purple{stroke:#AFA9EC}.m-purple{fill:#AFA9EC}.x-purple{fill:#AFA9EC}.teal .f{fill:#085041;stroke:#5DCAA5}.teal .ff{fill:#5DCAA5}.teal .tt{fill:#9FE1CB}.teal .st{fill:#5DCAA5}.l-teal{stroke:#5DCAA5}.m-teal{fill:#5DCAA5}.x-teal{fill:#5DCAA5}.coral .f{fill:#712B13;stroke:#F0997B}.coral .ff{fill:#F0997B}.coral .tt{fill:#F5C4B3}.coral .st{fill:#F0997B}.l-coral{stroke:#F0997B}.m-coral{fill:#F0997B}.x-coral{fill:#F0997B}.amber .f{fill:#633806;stroke:#EF9F27}.amber .ff{fill:#EF9F27}.amber .tt{fill:#FAC775}.amber .st{fill:#EF9F27}.l-amber{stroke:#EF9F27}.m-amber{fill:#EF9F27}.x-amber{fill:#EF9F27}.gray .f{fill:#444441;stroke:#B4B2A9}.gray .ff{fill:#B4B2A9}.gray .tt{fill:#D3D1C7}.gray .st{fill:#B4B2A9}.l-gray{stroke:#B4B2A9}.m-gray{fill:#B4B2A9}.x-gray{fill:#B4B2A9}.blue .f{fill:#0C447C;stroke:#85B7EB}.blue .ff{fill:#85B7EB}.blue .tt{fill:#B5D4F4}.blue .st{fill:#85B7EB}.l-blue{stroke:#85B7EB}.m-blue{fill:#85B7EB}.x-blue{fill:#85B7EB}}</style><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M1 1L9 5L1 9z"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-purple" d="M1 1L9 5L1 9z"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-teal" d="M1 1L9 5L1 9z"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="420" rx="10"/><rect class="frame" x="40" y="30" width="290" height="300" rx="10"/><text class="th" x="185" y="50" text-anchor="middle" dominant-baseline="central">Native (scraps_web.exe)</text><g class="purple"><rect class="f" x="58" y="66" width="254" height="48" rx="8"/><text class="th tt" x="185.0" y="80.0" text-anchor="middle" dominant-baseline="central">ClientApp::frame</text><text class="ts st" x="185.0" y="100.0" text-anchor="middle" dominant-baseline="central">simulate, net, audio, Views</text></g><g class="amber"><rect class="f" x="58" y="136" width="254" height="48" rx="8"/><text class="th tt" x="185.0" y="150.0" text-anchor="middle" dominant-baseline="central">Renderer2D (webview2)</text><text class="ts st" x="185.0" y="170.0" text-anchor="middle" dominant-baseline="central">batches + textures as bytes</text></g><g class="amber"><rect class="f" x="58" y="206" width="254" height="48" rx="8"/><text class="th tt" x="185.0" y="220.0" text-anchor="middle" dominant-baseline="central">UiHost and Input</text><text class="ts st" x="185.0" y="240.0" text-anchor="middle" dominant-baseline="central">view out; actions, input in</text></g><g class="gray"><rect class="f" x="58" y="266" width="254" height="48" rx="8"/><text class="th tt" x="185.0" y="280.0" text-anchor="middle" dominant-baseline="central">UiModel</text><text class="ts st" x="185.0" y="300.0" text-anchor="middle" dominant-baseline="central">action: Command or app call</text></g><path class="ln" d="M185 115 L185 134" marker-end="url(#a-gray)"/><rect class="frame" x="350" y="30" width="290" height="300" rx="10"/><text class="th" x="495" y="50" text-anchor="middle" dominant-baseline="central">Page (WebView2)</text><g class="coral"><rect class="f" x="368" y="66" width="254" height="48" rx="8"/><text class="th tt" x="495.0" y="80.0" text-anchor="middle" dominant-baseline="central">React UI (ui/)</text><text class="ts st" x="495.0" y="100.0" text-anchor="middle" dominant-baseline="central">menus, HUD, Esc</text></g><g class="coral"><rect class="f" x="368" y="136" width="254" height="48" rx="8"/><text class="th tt" x="495.0" y="150.0" text-anchor="middle" dominant-baseline="central">renderer.js: WebGL2</text><text class="ts st" x="495.0" y="170.0" text-anchor="middle" dominant-baseline="central">draws on canvas#world</text></g><g class="coral"><rect class="f" x="368" y="206" width="254" height="48" rx="8"/><text class="th tt" x="495.0" y="220.0" text-anchor="middle" dominant-baseline="central">Page input</text><text class="ts st" x="495.0" y="240.0" text-anchor="middle" dominant-baseline="central">keys, mouse while playing</text></g><path class="l-amber" d="M313 160 L366 160" marker-end="url(#a-amber)"/><path class="l-coral" d="M366 90 L340 90 L340 230 L314 230" marker-end="url(#a-coral)" marker-start="url(#a-coral)"/><path class="l-coral" d="M366 240 L346 240 L346 250 L314 250" marker-end="url(#a-coral)"/><text class="ts" x="40" y="352" text-anchor="start" dominant-baseline="central">Frame bytes go through a shared buffer (a 20-byte note per frame, no JSON per vertex).</text><text class="ts" x="40" y="372" text-anchor="start" dominant-baseline="central">Views are sent only on change; actions and input have fixed limits.</text><g class="purple"><rect class="f" x="40" y="394" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="400" text-anchor="start" dominant-baseline="central">engine</text><g class="amber"><rect class="f" x="123.6" y="394" width="12" height="12" rx="2"/></g><text class="ts" x="141.6" y="400" text-anchor="start" dominant-baseline="central">webview2 backend</text><g class="coral"><rect class="f" x="273.2" y="394" width="12" height="12" rx="2"/></g><text class="ts" x="291.2" y="400" text-anchor="start" dominant-baseline="central">page</text><g class="gray"><rect class="f" x="343.6" y="394" width="12" height="12" rx="2"/></g><text class="ts" x="361.6" y="400" text-anchor="start" dominant-baseline="central">app</text></svg>
