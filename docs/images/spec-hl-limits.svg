<svg xmlns="http://www.w3.org/2000/svg" width="680" height="450" viewBox="0 0 680 450" role="img"><title>Rate limits</title><desc>Datagrams from connected clients are limited to 8 per tick each. From unknown addresses only a Hello is answered, through a per-address bucket and a global bucket, before a Challenge or Welcome is sent.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill:#5F5E5A}.x-gray{fill:#5F5E5A}.blue .f{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.8}.blue .ff{fill:#185FA5}.blue .tt{fill:#0C447C}.blue .st{fill:#185FA5}.l-blue{stroke:#185FA5;fill:none;stroke-width:1.6}.m-blue{fill:#185FA5}.x-blue{fill:#185FA5}@media (prefers-color-scheme: dark){.bg{fill:#1F1F1E}text{fill:#E8E6DE}.ts{fill:#B4B2A9}.ln{stroke:#9C9A92}.mk{fill:#9C9A92}.frame{stroke:#5F5E5A}.purple .f{fill:#3C3489;stroke:#AFA9EC}.purple .ff{fill:#AFA9EC}.purple .tt{fill:#CECBF6}.purple .st{fill:#AFA9EC}.l-purple{stroke:#AFA9EC}.m-purple{fill:#AFA9EC}.x-purple{fill:#AFA9EC}.teal .f{fill:#085041;stroke:#5DCAA5}.teal .ff{fill:#5DCAA5}.teal .tt{fill:#9FE1CB}.teal .st{fill:#5DCAA5}.l-teal{stroke:#5DCAA5}.m-teal{fill:#5DCAA5}.x-teal{fill:#5DCAA5}.coral .f{fill:#712B13;stroke:#F0997B}.coral .ff{fill:#F0997B}.coral .tt{fill:#F5C4B3}.coral .st{fill:#F0997B}.l-coral{stroke:#F0997B}.m-coral{fill:#F0997B}.x-coral{fill:#F0997B}.amber .f{fill:#633806;stroke:#EF9F27}.amber .ff{fill:#EF9F27}.amber .tt{fill:#FAC775}.amber .st{fill:#EF9F27}.l-amber{stroke:#EF9F27}.m-amber{fill:#EF9F27}.x-amber{fill:#EF9F27}.gray .f{fill:#444441;stroke:#B4B2A9}.gray .ff{fill:#B4B2A9}.gray .tt{fill:#D3D1C7}.gray .st{fill:#B4B2A9}.l-gray{stroke:#B4B2A9}.m-gray{fill:#B4B2A9}.x-gray{fill:#B4B2A9}.blue .f{fill:#0C447C;stroke:#85B7EB}.blue .ff{fill:#85B7EB}.blue .tt{fill:#B5D4F4}.blue .st{fill:#85B7EB}.l-blue{stroke:#85B7EB}.m-blue{fill:#85B7EB}.x-blue{fill:#85B7EB}}</style><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M1 1L9 5L1 9z"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-purple" d="M1 1L9 5L1 9z"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-teal" d="M1 1L9 5L1 9z"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="450" rx="10"/><g class="gray"><rect class="f" x="250" y="30" width="180" height="48" rx="8"/><text class="th tt" x="340.0" y="54.0" text-anchor="middle" dominant-baseline="central">A datagram arrives</text></g><path class="ln" d="M340 78 L340 92 L190 92 L190 100"/><path class="ln" d="M340 92 L490 92 L490 100"/><path class="ln" d="M190 100 L190 106" marker-end="url(#a-gray)"/><path class="ln" d="M490 100 L490 106" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="60" y="108" width="260" height="56" rx="8"/><text class="th tt" x="190.0" y="126.0" text-anchor="middle" dominant-baseline="central">From a connected client</text><text class="ts st" x="190.0" y="146.0" text-anchor="middle" dominant-baseline="central">needs its session token</text></g><g class="gray"><rect class="f" x="360" y="108" width="260" height="56" rx="8"/><text class="th tt" x="490.0" y="126.0" text-anchor="middle" dominant-baseline="central">From an unknown address</text><text class="ts st" x="490.0" y="146.0" text-anchor="middle" dominant-baseline="central">only a Hello gets an answer</text></g><path class="ln" d="M190 166 L190 186" marker-end="url(#a-gray)"/><path class="ln" d="M490 166 L490 186" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="60" y="188" width="260" height="56" rx="8"/><text class="th tt" x="190.0" y="206.0" text-anchor="middle" dominant-baseline="central">About 8 per tick</text><text class="ts st" x="190.0" y="226.0" text-anchor="middle" dominant-baseline="central">480/s, burst 64; extra dropped</text></g><g class="amber"><rect class="f" x="360" y="188" width="260" height="56" rx="8"/><text class="th tt" x="490.0" y="206.0" text-anchor="middle" dominant-baseline="central">Per-address bucket</text><text class="ts st" x="490.0" y="226.0" text-anchor="middle" dominant-baseline="central">5 replies/s, burst 10, 64 addresses</text></g><path class="ln" d="M490 246 L490 266" marker-end="url(#a-gray)"/><g class="amber"><rect class="f" x="360" y="268" width="260" height="56" rx="8"/><text class="th tt" x="490.0" y="286.0" text-anchor="middle" dominant-baseline="central">Global bucket</text><text class="ts st" x="490.0" y="306.0" text-anchor="middle" dominant-baseline="central">200 replies/s for all strangers</text></g><path class="ln" d="M490 326 L490 346" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="360" y="348" width="260" height="56" rx="8"/><text class="th tt" x="490.0" y="376.0" text-anchor="middle" dominant-baseline="central">Challenge or Welcome sent</text></g><g class="amber"><rect class="f" x="40" y="422" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="428" text-anchor="start" dominant-baseline="central">new limits</text><g class="purple"><rect class="f" x="150.0" y="422" width="12" height="12" rx="2"/></g><text class="ts" x="168.0" y="428" text-anchor="start" dominant-baseline="central">per-client work</text><g class="teal"><rect class="f" x="293.0" y="422" width="12" height="12" rx="2"/></g><text class="ts" x="311.0" y="428" text-anchor="start" dominant-baseline="central">reply</text></svg>
