"7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="170" rx="10"/><g class="gray"><rect class="f" x="40" y="40" width="48" height="40"/><text class="ts tt" x="64.0" y="60" text-anchor="middle" dominant-baseline="central">base</text></g><g class="gray"><rect class="f" x="88" y="40" width="40" height="40"/><text class="ts tt" x="108.0" y="60" text-anchor="middle" dominant-baseline="central">+tick</text></g><g class="gray"><rect class="f" x="128" y="40" width="86" height="40"/><text class="ts tt" x="171.0" y="60" text-anchor="middle" dominant-baseline="central">rng</text></g><g class="gray"><rect class="f" x="214" y="40" width="40" height="40"/><text class="ts tt" x="234.0" y="60" text-anchor="middle" dominant-baseline="central">slots</text></g><g class="gray"><rect class="f" x="254" y="40" width="46" height="40"/><text class="ts tt" x="277.0" y="60" text-anchor="middle" dominant-baseline="central">count</text></g><g class="purple"><rect class="f" x="300" y="40" width="40" height="40"/><text class="ts tt" x="320.0" y="60" text-anchor="middle" dominant-baseline="central">skip</text></g><g class="purple"><rect class="f" x="340" y="40" width="44" height="40"/><text class="ts tt" x="362.0" y="60" text-anchor="middle" dominant-baseline="central">mask</text></g><g class="purple"><rect class="f" x="384" y="40" width="120" height="40"/><text class="ts tt" x="444.0" y="60" text-anchor="middle" dominant-baseline="central">position</text></g><g class="purple"><rect class="f" x="504" y="40" width="40" height="40"/><text class="ts tt" x="524.0" y="60" text-anchor="middle" dominant-baseline="central">…</text></g><g class="gray"><rect class="f" x="544" y="40" width="36" height="40"/><text class="ts tt" x="562.0" y="60" text-anchor="middle" dominant-baseline="central">free</text></g><g class="gray"><rect class="f" x="580" y="40" width="56" height="40"/><text class="ts tt" x="608.0" y="60" text-anchor="middle" dominant-baseline="central">players</text></g><path class="ln" d="M40 92 L40 98 L300 98 L300 92"/><text class="ts" x="170.0" y="114" text-anchor="middle" dominant-baseline="central">header ≈ 16 bytes</text><path class="ln" d="M300 92 L300 98 L504 98 L504 92"/><text class="ts" x="402.0" y="114" text-anchor="middle" dominant-baseline="central">one moving entity ≈ 14 bytes</text><path class="ln" d="M544 92 L544 98 L636 98 L636 92"/><text class="ts" x="590.0" y="114" text-anchor="middle" dominant-baseline="central">2 bytes</text><text class="ts" x="40" y="146" text-anchor="start" dominant-baseline="central">mask = which groups follow: slot · pose · motion · control · look · game. Unchanged entities cost nothing.</text></svg>
