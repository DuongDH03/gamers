path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="470" rx="10"/><text class="th" x="40" y="28" text-anchor="start" dominant-baseline="central">Wave 1: four agents at once, each on its own branch</text><g class="teal"><rect class="f" x="40" y="44" width="140" height="56" rx="8"/><text class="th tt" x="110.0" y="62.0" text-anchor="middle" dominant-baseline="central">Save, load, pause</text><text class="ts st" x="110.0" y="82.0" text-anchor="middle" dominant-baseline="central">core/save, pause</text></g><path class="l-teal" d="M110 101 L110 124" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="192" y="44" width="140" height="56" rx="8"/><text class="th tt" x="262.0" y="62.0" text-anchor="middle" dominant-baseline="central">Music</text><text class="ts st" x="262.0" y="82.0" text-anchor="middle" dominant-baseline="central">streaming, mixer</text></g><path class="l-teal" d="M262 101 L262 124" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="344" y="44" width="140" height="56" rx="8"/><text class="th tt" x="414.0" y="62.0" text-anchor="middle" dominant-baseline="central">Gamepad</text><text class="ts st" x="414.0" y="82.0" text-anchor="middle" dominant-baseline="central">Input, Controls</text></g><path class="l-teal" d="M414 101 L414 124" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="496" y="44" width="140" height="56" rx="8"/><text class="th tt" x="566.0" y="62.0" text-anchor="middle" dominant-baseline="central">Packaging</text><text class="ts st" x="566.0" y="82.0" text-anchor="middle" dominant-baseline="central">game choice, zip</text></g><path class="l-teal" d="M566 101 L566 124" marker-end="url(#a-teal)"/><g class="purple"><rect class="f" x="40" y="126" width="600" height="48" rx="8"/><text class="th tt" x="340.0" y="140.0" text-anchor="middle" dominant-baseline="central">Merge into main, then reviewer (Go/No-Go) and bench</text><text class="ts st" x="340.0" y="160.0" text-anchor="middle" dominant-baseline="central">one commit per part</text></g><text class="th" x="40" y="214" text-anchor="start" dominant-baseline="central">Wave 2: after you choose UI layout A or B</text><path class="ln" d="M495 175 L495 228" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="40" y="230" width="290" height="56" rx="8"/><text class="th tt" x="185.0" y="248.0" text-anchor="middle" dominant-baseline="central">UI prerequisites</text><text class="ts st" x="185.0" y="268.0" text-anchor="middle" dominant-baseline="central">event list, text, one-frame loop</text></g><path class="l-teal" d="M331 258 L348 258" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="350" y="230" width="290" height="56" rx="8"/><text class="th tt" x="495.0" y="248.0" text-anchor="middle" dominant-baseline="central">UI layer</text><text class="ts st" x="495.0" y="268.0" text-anchor="middle" dominant-baseline="central">backend + React screens</text></g><path class="ln" d="M495 287 L495 318" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="350" y="320" width="290" height="48" rx="8"/><text class="th tt" x="495.0" y="334.0" text-anchor="middle" dominant-baseline="central">Review, bench</text><text class="ts st" x="495.0" y="354.0" text-anchor="middle" dominant-baseline="central">commit</text></g><path class="ln" d="M495 369 L495 396" marker-end="url(#a-gray)"/><g class="coral"><rect class="f" x="350" y="398" width="290" height="40" rx="8"/><text class="th tt" x="495.0" y="418.0" text-anchor="middle" dominant-baseline="central">Push to origin/main</text></g><g class="teal"><rect class="f" x="40" y="446" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="452" text-anchor="start" dominant-baseline="central">engine-dev agent</text><g class="purple"><rect class="f" x="189.6" y="446" width="12" height="12" rx="2"/></g><text class="ts" x="207.6" y="452" text-anchor="start" dominant-baseline="central">checks and merge</text><g class="coral"><rect class="f" x="339.2" y="446" width="12" height="12" rx="2"/></g><text class="ts" x="357.2" y="452" text-anchor="start" dominant-baseline="central">goes public</text></svg>
