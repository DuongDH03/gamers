<svg xmlns="http://www.w3.org/2000/svg" width="680" height="336" viewBox="0 0 680 336" role="img"><title>From the cursor back to the world</title><desc>Each View turns the cursor point into a world point on its own pointer plane through the player: top-down and isometric use the plane at the player's height, side view uses the player's lane. The formulas are the exact inverse of world_to_screen.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill:#5F5E5A}.x-gray{fill:#5F5E5A}.blue .f{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.8}.blue .ff{fill:#185FA5}.blue .tt{fill:#0C447C}.blue .st{fill:#185FA5}.l-blue{stroke:#185FA5;fill:none;stroke-width:1.6}.m-blue{fill:#185FA5}.x-blue{fill:#185FA5}@media (prefers-color-scheme: dark){.bg{fill:#1F1F1E}text{fill:#E8E6DE}.ts{fill:#B4B2A9}.ln{stroke:#9C9A92}.mk{fill:#9C9A92}.frame{stroke:#5F5E5A}.purple .f{fill:#3C3489;stroke:#AFA9EC}.purple .ff{fill:#AFA9EC}.purple .tt{fill:#CECBF6}.purple .st{fill:#AFA9EC}.l-purple{stroke:#AFA9EC}.m-purple{fill:#AFA9EC}.x-purple{fill:#AFA9EC}.teal .f{fill:#085041;stroke:#5DCAA5}.teal .ff{fill:#5DCAA5}.teal .tt{fill:#9FE1CB}.teal .st{fill:#5DCAA5}.l-teal{stroke:#5DCAA5}.m-teal{fill:#5DCAA5}.x-teal{fill:#5DCAA5}.coral .f{fill:#712B13;stroke:#F0997B}.coral .ff{fill:#F0997B}.coral .tt{fill:#F5C4B3}.coral .st{fill:#F0997B}.l-coral{stroke:#F0997B}.m-coral{fill:#F0997B}.x-coral{fill:#F0997B}.amber .f{fill:#633806;stroke:#EF9F27}.amber .ff{fill:#EF9F27}.amber .tt{fill:#FAC775}.amber .st{fill:#EF9F27}.l-amber{stroke:#EF9F27}.m-amber{fill:#EF9F27}.x-amber{fill:#EF9F27}.gray .f{fill:#444441;stroke:#B4B2A9}.gray .ff{fill:#B4B2A9}.gray .tt{fill:#D3D1C7}.gray .st{fill:#B4B2A9}.l-gray{stroke:#B4B2A9}.m-gray{fill:#B4B2A9}.x-gray{fill:#B4B2A9}.blue .f{fill:#0C447C;stroke:#85B7EB}.blue .ff{fill:#85B7EB}.blue .tt{fill:#B5D4F4}.blue .st{fill:#85B7EB}.l-blue{stroke:#85B7EB}.m-blue{fill:#85B7EB}.x-blue{fill:#85B7EB}}</style><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M1 1L9 5L1 9z"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-purple" d="M1 1L9 5L1 9z"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-teal" d="M1 1L9 5L1 9z"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="336" rx="10"/><rect class="frame" x="40" y="30" width="190" height="245" rx="10"/><text class="th" x="135" y="48" text-anchor="middle" dominant-baseline="central">Top-down</text><g class="teal"><rect class="f" x="95" y="64" width="80" height="56" rx="2"/></g><path class="ln" d="M135 64 L135 120"/><path class="ln" d="M95 92 L175 92"/><circle class="x-purple" cx="152" cy="78" r="4"/><text class="mono" x="56" y="146" text-anchor="start" dominant-baseline="central">plane z = player.z</text><text class="mono" x="56" y="166" text-anchor="start" dominant-baseline="central">x = cx + dx / zoom</text><text class="mono" x="56" y="186" text-anchor="start" dominant-baseline="central">y = cy + dy / zoom</text><rect class="frame" x="245" y="30" width="190" height="245" rx="10"/><text class="th" x="340" y="48" text-anchor="middle" dominant-baseline="central">Side</text><g class="teal"><rect class="f" x="280" y="106" width="120" height="14" rx="2"/></g><g class="gray"><rect class="f" x="300" y="88" width="18" height="18" rx="2"/></g><circle class="x-purple" cx="365" cy="84" r="4"/><text class="mono" x="261" y="146" text-anchor="start" dominant-baseline="central">plane y = player lane</text><text class="mono" x="261" y="166" text-anchor="start" dominant-baseline="central">x = cx + dx / zoom</text><text class="mono" x="261" y="186" text-anchor="start" dominant-baseline="central">z = cz - dy / zoom</text><rect class="frame" x="450" y="30" width="190" height="245" rx="10"/><text class="th" x="545" y="48" text-anchor="middle" dominant-baseline="central">Isometric</text><g class="teal"><polygon class="f" points="545,64 605,92 545,120 485,92"/></g><circle class="x-purple" cx="560" cy="94" r="4"/><text class="mono" x="466" y="146" text-anchor="start" dominant-baseline="central">plane z = player.z</text><text class="mono" x="466" y="166" text-anchor="start" dominant-baseline="central">a = 2 dx / zoom</text><text class="mono" x="466" y="186" text-anchor="start" dominant-baseline="central">b = 4 dy / zoom</text><text class="mono" x="466" y="206" text-anchor="start" dominant-baseline="central">b += 2 (z - cz)</text><text class="mono" x="466" y="226" text-anchor="start" dominant-baseline="central">x = cx + (a + b) / 2</text><text class="mono" x="466" y="246" text-anchor="start" dominant-baseline="central">y = cy + (b - a) / 2</text><text class="ts" x="40" y="296" text-anchor="start" dominant-baseline="central">dx, dy: pixels from the viewport centre. c: camera.target.</text><text class="ts" x="40" y="314" text-anchor="start" dominant-baseline="central">Each View picks its own plane (Rule 4).</text></svg>
