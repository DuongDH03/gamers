text-anchor="middle" dominant-baseline="central">B. HTML overlay</text><g class="coral"><rect class="f" x="368" y="66" width="250" height="48" rx="8"/><text class="th tt" x="493.0" y="80.0" text-anchor="middle" dominant-baseline="central">UI texture on top</text><text class="ts st" x="493.0" y="100.0" text-anchor="middle" dominant-baseline="central">redrawn when it changes</text></g><g class="purple"><rect class="f" x="368" y="124" width="250" height="48" rx="8"/><text class="th tt" x="493.0" y="138.0" text-anchor="middle" dominant-baseline="central">World on the SDL GPU</text><text class="ts st" x="493.0" y="158.0" text-anchor="middle" dominant-baseline="central">as today</text></g><path class="l-coral" d="M623 264 L632 264 L632 90 L624 90" marker-end="url(#a-coral)"/><g class="coral"><rect class="f" x="368" y="240" width="250" height="48" rx="8"/><text class="th tt" x="493.0" y="254.0" text-anchor="middle" dominant-baseline="central">Offscreen browser engine</text><text class="ts st" x="493.0" y="274.0" text-anchor="middle" dominant-baseline="central">Ultralight or CEF</text></g><g class="coral"><rect class="f" x="40" y="310" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="316" text-anchor="start" dominant-baseline="central">new UI pieces</text><g class="purple"><rect class="f" x="169.8" y="310" width="12" height="12" rx="2"/></g><text class="ts" x="187.8" y="316" text-anchor="start" dominant-baseline="central">engine, unchanged</text></svg>
