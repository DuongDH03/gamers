<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>UI layouts A and B</title><desc>Layout A: a WebView2 window owns the screen; React draws menus in the page and a WebGL canvas draws the world from the triangle batches the engine Views already produce, sent through shared memory. Layout B: the sdl3 window draws the world on the GPU as today, and an offscreen browser engine renders React into a bitmap drawn on top as a texture.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill: