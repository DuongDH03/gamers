f" x="40" y="280" width="300" height="56" rx="8"/><text class="th tt" x="190.0" y="298.0" text-anchor="middle" dominant-baseline="central">Convert</text><text class="ts st" x="190.0" y="318.0" text-anchor="middle" dominant-baseline="central">48 kHz stereo float, any rate or channels</text></g><g class="teal"><rect class="f" x="380" y="40" width="260" height="56" rx="8"/><text class="th tt" x="510.0" y="58.0" text-anchor="middle" dominant-baseline="central">Game event</text><text class="ts st" x="510.0" y="78.0" text-anchor="middle" dominant-baseline="central">jump, coin picked up, coin dropped</text></g><path class="ln" d="M510 98 L510 118" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="380" y="120" width="260" height="56" rx="8"/><text class="th tt" x="510.0" y="138.0" text-anchor="middle" dominant-baseline="central">Mixer (core)</text><text class="ts st" x="510.0" y="158.0" text-anchor="middle" dominant-baseline="central">32 voices, volume, no allocation</text></g><path class="ln" d="M510 178 L510 198" marker-end="url(#a-gray)"/><g class="amber"><rect class="f" x="380" y="200" width="260" height="56" rx="8"/><text class="th tt" x="510.0" y="218.0" text-anchor="middle" dominant-baseline="central">Audio::submit (backend)</text><text class="ts st" x="510.0" y="238.0" text-anchor="middle" dominant-baseline="central">keeps about 60 ms queued</text></g><path class="ln" d="M510 258 L510 278" marker-end="url(#a-gray)"/><g class="gray"><rect class="f" x="380" y="280" width="260" height="56" rx="8"/><text class="th tt" x="510.0" y="308.0" text-anchor="middle" dominant-baseline="central">Speakers</text></g><path class="ln" d="M342 308 L360 308 L360 148 L378 148" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="40" y="378" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="384" text-anchor="start" dominant-baseline="central">core</text><g class="amber"><rect class="f" x="110.4" y="378" width="12" height="12" rx="2"/></g><text class="