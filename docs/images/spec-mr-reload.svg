<svg xmlns="http://www.w3.org/2000/svg" width="680" height="470" viewBox="0 0 680 470" role="img"><title>Swapping the game code</title><desc>Build only the module target; the FileWatcher sees the DLL change and waits until the file is stable; the app copies it to a numbered live file and loads it; it checks the API version and layout hash. On a mismatch it keeps the old code and shows a message. Otherwise, between two frames, it swaps simulate in Server and Client and rebinds the controls, then unloads the old copy.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill:#5F5E5A}.x-gray{fill:#5F5E5A}.blue .f{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.8}.blue .ff{fill:#185FA5}.blue .tt{fill:#0C447C}.blue .st{fill:#185FA5}.l-blue{stroke:#185FA5;fill:none;stroke-width:1.6}.m-blue{fill:#185FA5}.x-blue{fill:#185FA5}@media (prefers-color-scheme: dark){.bg{fill:#1F1F1E}text{fill:#E8E6DE}.ts{fill:#B4B2A9}.ln{stroke:#9C9A92}.mk{fill:#9C9A92}.frame{stroke:#5F5E5A}.purple .f{fill:#3C3489;stroke:#AFA9EC}.purple .ff{fill:#AFA9EC}.purple .tt{fill:#CECBF6}.purple .st{fill:#AFA9EC}.l-purple{stroke:#AFA9EC}.m-purple{fill:#AFA9EC}.x-purple{fill:#AFA9EC}.teal .f{fill:#085041;stroke:#5DCAA5}.teal .ff{fill:#5DCAA5}.teal .tt{fill:#9FE1CB}.teal .st{fill:#5DCAA5}.l-teal{stroke:#5DCAA5}.m-teal{fill:#5DCAA5}.x-teal{fill:#5DCAA5}.coral .f{fill:#712B13;stroke:#F0997B}.coral .ff{fill:#F0997B}.coral .tt{fill:#F5C4B3}.coral .st{fill:#F0997B}.l-coral{stroke:#F0997B}.m-coral{fill:#F0997B}.x-coral{fill:#F0997B}.amber .f{fill:#633806;stroke:#EF9F27}.amber .ff{fill:#EF9F27}.amber .tt{fill:#FAC775}.amber .st{fill:#EF9F27}.l-amber{stroke:#EF9F27}.m-amber{fill:#EF9F27}.x-amber{fill:#EF9F27}.gray .f{fill:#444441;stroke:#B4B2A9}.gray .ff{fill:#B4B2A9}.gray .tt{fill:#D3D1C7}.gray .st{fill:#B4B2A9}.l-gray{stroke:#B4B2A9}.m-gray{fill:#B4B2A9}.x-gray{fill:#B4B2A9}.blue .f{fill:#0C447C;stroke:#85B7EB}.blue .ff{fill:#85B7EB}.blue .tt{fill:#B5D4F4}.blue .st{fill:#85B7EB}.l-blue{stroke:#85B7EB}.m-blue{fill:#85B7EB}.x-blue{fill:#85B7EB}}</style><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M1 1L9 5L1 9z"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-purple" d="M1 1L9 5L1 9z"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-teal" d="M1 1L9 5L1 9z"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="470" rx="10"/><g class="teal"><rect class="f" x="60" y="30" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="44.0" text-anchor="middle" dominant-baseline="central">Build only the module</text><text class="ts st" x="220.0" y="64.0" text-anchor="middle" dominant-baseline="central">cmake --build --preset mingw-game</text></g><path class="ln" d="M220 79 L220 96" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="60" y="98" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="112.0" text-anchor="middle" dominant-baseline="central">FileWatcher sees the .dll change</text><text class="ts st" x="220.0" y="132.0" text-anchor="middle" dominant-baseline="central">then waits for a stable file</text></g><path class="ln" d="M220 147 L220 164" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="60" y="166" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="180.0" text-anchor="middle" dominant-baseline="central">Copy to live-N.dll and load it</text><text class="ts st" x="220.0" y="200.0" text-anchor="middle" dominant-baseline="central">the original stays writable</text></g><path class="ln" d="M220 215 L220 232" marker-end="url(#a-gray)"/><g class="purple"><rect class="f" x="60" y="234" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="248.0" text-anchor="middle" dominant-baseline="central">Check api_version, layout_hash</text><text class="ts st" x="220.0" y="268.0" text-anchor="middle" dominant-baseline="central">same engine structs?</text></g><path class="ln" d="M220 283 L220 300" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="60" y="302" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="316.0" text-anchor="middle" dominant-baseline="central">Swap between two frames</text><text class="ts st" x="220.0" y="336.0" text-anchor="middle" dominant-baseline="central">set_simulate, rebind controls</text></g><path class="ln" d="M220 351 L220 368" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="60" y="370" width="320" height="48" rx="8"/><text class="th tt" x="220.0" y="384.0" text-anchor="middle" dominant-baseline="central">Unload the old copy</text><text class="ts st" x="220.0" y="404.0" text-anchor="middle" dominant-baseline="central">HUD: game code reloaded</text></g><text class="ts" x="232" y="291" text-anchor="start" dominant-baseline="central">yes</text><path class="l-coral" d="M381 258 L428 258" marker-end="url(#a-coral)"/><text class="ts" x="404" y="246" text-anchor="middle" dominant-baseline="central">no</text><g class="coral"><rect class="f" x="430" y="234" width="210" height="48" rx="8"/><text class="th tt" x="535.0" y="248.0" text-anchor="middle" dominant-baseline="central">Keep the old code</text><text class="ts st" x="535.0" y="268.0" text-anchor="middle" dominant-baseline="central">HUD: engine mismatch</text></g><g class="teal"><rect class="f" x="40" y="440" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="446" text-anchor="start" dominant-baseline="central">step</text><g class="purple"><rect class="f" x="110.4" y="440" width="12" height="12" rx="2"/></g><text class="ts" x="128.4" y="446" text-anchor="start" dominant-baseline="central">safety check</text><g class="coral"><rect class="f" x="233.6" y="440" width="12" height="12" rx="2"/></g><text class="ts" x="251.6" y="446" text-anchor="start" dominant-baseline="central">refused, nothing breaks</text></svg>
