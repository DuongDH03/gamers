<svg xmlns="http://www.w3.org/2000/svg" width="680" height="250" viewBox="0 0 680 250" role="img"><title>A click becomes a command</title><desc>A mouse event is read once per frame into Input in pixels; Controls.sample turns a click into a world point through the View and latches it; at the next tick Controls.emit sends a Command whose vec is that point; simulate on the server checks reach and changes the World or not. Wheel and hover only move the camera or draw an outline.</desc><style>text{font-family:"Segoe UI",system-ui,-apple-system,Helvetica,Arial,sans-serif;fill:#2C2C2A}.t{font-size:14px}.ts{font-size:12px;fill:#5F5E5A}.th{font-size:14px;font-weight:600}.mono{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:12px}.ln{stroke:#73726C;fill:none;stroke-width:1.2}.dash{stroke-dasharray:4 3}.frame{fill:none;stroke:#B4B2A9;stroke-width:0.8;stroke-dasharray:4 3}.mk{fill:#73726C}.bg{fill:#FCFCFB}.purple .f{fill:#EEEDFE;stroke:#534AB7;stroke-width:0.8}.purple .ff{fill:#534AB7}.purple .tt{fill:#3C3489}.purple .st{fill:#534AB7}.l-purple{stroke:#534AB7;fill:none;stroke-width:1.6}.m-purple{fill:#534AB7}.x-purple{fill:#534AB7}.teal .f{fill:#E1F5EE;stroke:#0F6E56;stroke-width:0.8}.teal .ff{fill:#0F6E56}.teal .tt{fill:#085041}.teal .st{fill:#0F6E56}.l-teal{stroke:#0F6E56;fill:none;stroke-width:1.6}.m-teal{fill:#0F6E56}.x-teal{fill:#0F6E56}.coral .f{fill:#FAECE7;stroke:#993C1D;stroke-width:0.8}.coral .ff{fill:#993C1D}.coral .tt{fill:#712B13}.coral .st{fill:#993C1D}.l-coral{stroke:#993C1D;fill:none;stroke-width:1.6}.m-coral{fill:#993C1D}.x-coral{fill:#993C1D}.amber .f{fill:#FAEEDA;stroke:#854F0B;stroke-width:0.8}.amber .ff{fill:#854F0B}.amber .tt{fill:#633806}.amber .st{fill:#854F0B}.l-amber{stroke:#854F0B;fill:none;stroke-width:1.6}.m-amber{fill:#854F0B}.x-amber{fill:#854F0B}.gray .f{fill:#F1EFE8;stroke:#5F5E5A;stroke-width:0.8}.gray .ff{fill:#5F5E5A}.gray .tt{fill:#444441}.gray .st{fill:#5F5E5A}.l-gray{stroke:#5F5E5A;fill:none;stroke-width:1.6}.m-gray{fill:#5F5E5A}.x-gray{fill:#5F5E5A}.blue .f{fill:#E6F1FB;stroke:#185FA5;stroke-width:0.8}.blue .ff{fill:#185FA5}.blue .tt{fill:#0C447C}.blue .st{fill:#185FA5}.l-blue{stroke:#185FA5;fill:none;stroke-width:1.6}.m-blue{fill:#185FA5}.x-blue{fill:#185FA5}@media (prefers-color-scheme: dark){.bg{fill:#1F1F1E}text{fill:#E8E6DE}.ts{fill:#B4B2A9}.ln{stroke:#9C9A92}.mk{fill:#9C9A92}.frame{stroke:#5F5E5A}.purple .f{fill:#3C3489;stroke:#AFA9EC}.purple .ff{fill:#AFA9EC}.purple .tt{fill:#CECBF6}.purple .st{fill:#AFA9EC}.l-purple{stroke:#AFA9EC}.m-purple{fill:#AFA9EC}.x-purple{fill:#AFA9EC}.teal .f{fill:#085041;stroke:#5DCAA5}.teal .ff{fill:#5DCAA5}.teal .tt{fill:#9FE1CB}.teal .st{fill:#5DCAA5}.l-teal{stroke:#5DCAA5}.m-teal{fill:#5DCAA5}.x-teal{fill:#5DCAA5}.coral .f{fill:#712B13;stroke:#F0997B}.coral .ff{fill:#F0997B}.coral .tt{fill:#F5C4B3}.coral .st{fill:#F0997B}.l-coral{stroke:#F0997B}.m-coral{fill:#F0997B}.x-coral{fill:#F0997B}.amber .f{fill:#633806;stroke:#EF9F27}.amber .ff{fill:#EF9F27}.amber .tt{fill:#FAC775}.amber .st{fill:#EF9F27}.l-amber{stroke:#EF9F27}.m-amber{fill:#EF9F27}.x-amber{fill:#EF9F27}.gray .f{fill:#444441;stroke:#B4B2A9}.gray .ff{fill:#B4B2A9}.gray .tt{fill:#D3D1C7}.gray .st{fill:#B4B2A9}.l-gray{stroke:#B4B2A9}.m-gray{fill:#B4B2A9}.x-gray{fill:#B4B2A9}.blue .f{fill:#0C447C;stroke:#85B7EB}.blue .ff{fill:#85B7EB}.blue .tt{fill:#B5D4F4}.blue .st{fill:#85B7EB}.l-blue{stroke:#85B7EB}.m-blue{fill:#85B7EB}.x-blue{fill:#85B7EB}}</style><defs><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="mk" d="M1 1L9 5L1 9z"/></marker><marker id="a-purple" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-purple" d="M1 1L9 5L1 9z"/></marker><marker id="a-teal" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-teal" d="M1 1L9 5L1 9z"/></marker><marker id="a-coral" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-coral" d="M1 1L9 5L1 9z"/></marker><marker id="a-amber" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-amber" d="M1 1L9 5L1 9z"/></marker><marker id="a-gray" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-gray" d="M1 1L9 5L1 9z"/></marker><marker id="a-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="m-blue" d="M1 1L9 5L1 9z"/></marker></defs><rect class="bg" width="680" height="250" rx="10"/><g class="purple"><rect class="f" x="40" y="30" width="140" height="56" rx="8"/><text class="th tt" x="110.0" y="48.0" text-anchor="middle" dominant-baseline="central">Mouse event</text><text class="ts st" x="110.0" y="68.0" text-anchor="middle" dominant-baseline="central">read each frame</text></g><path class="l-purple" d="M181 58 L191 58" marker-end="url(#a-purple)"/><g class="purple"><rect class="f" x="192" y="30" width="140" height="56" rx="8"/><text class="th tt" x="262.0" y="48.0" text-anchor="middle" dominant-baseline="central">Input</text><text class="ts st" x="262.0" y="68.0" text-anchor="middle" dominant-baseline="central">pixels, latched</text></g><path class="l-purple" d="M333 58 L343 58" marker-end="url(#a-purple)"/><g class="purple"><rect class="f" x="344" y="30" width="140" height="56" rx="8"/><text class="th tt" x="414.0" y="48.0" text-anchor="middle" dominant-baseline="central">Controls.sample</text><text class="ts st" x="414.0" y="68.0" text-anchor="middle" dominant-baseline="central">screen to world</text></g><path class="l-purple" d="M485 58 L495 58" marker-end="url(#a-purple)"/><g class="purple"><rect class="f" x="496" y="30" width="140" height="56" rx="8"/><text class="th tt" x="566.0" y="48.0" text-anchor="middle" dominant-baseline="central">Latched click</text><text class="ts st" x="566.0" y="68.0" text-anchor="middle" dominant-baseline="central">button + point</text></g><path class="ln" d="M566 87 L566 110 L110 110"/><path class="ln" d="M110 110 L110 128" marker-end="url(#a-gray)"/><g class="teal"><rect class="f" x="40" y="130" width="140" height="56" rx="8"/><text class="th tt" x="110.0" y="148.0" text-anchor="middle" dominant-baseline="central">Next tick: emit</text><text class="ts st" x="110.0" y="168.0" text-anchor="middle" dominant-baseline="central">vec = the point</text></g><path class="l-teal" d="M181 158 L191 158" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="192" y="130" width="140" height="56" rx="8"/><text class="th tt" x="262.0" y="148.0" text-anchor="middle" dominant-baseline="central">simulate</text><text class="ts st" x="262.0" y="168.0" text-anchor="middle" dominant-baseline="central">checks reach</text></g><path class="l-teal" d="M333 158 L343 158" marker-end="url(#a-teal)"/><g class="teal"><rect class="f" x="344" y="130" width="140" height="56" rx="8"/><text class="th tt" x="414.0" y="148.0" text-anchor="middle" dominant-baseline="central">World</text><text class="ts st" x="414.0" y="168.0" text-anchor="middle" dominant-baseline="central">coin placed?</text></g><g class="gray"><rect class="f" x="496" y="130" width="140" height="56" rx="8"/><text class="th tt" x="566.0" y="148.0" text-anchor="middle" dominant-baseline="central">Wheel, hover</text><text class="ts st" x="566.0" y="168.0" text-anchor="middle" dominant-baseline="central">camera only</text></g><g class="purple"><rect class="f" x="40" y="216" width="12" height="12" rx="2"/></g><text class="ts" x="58" y="222" text-anchor="start" dominant-baseline="central">every frame</text><g class="teal"><rect class="f" x="156.6" y="216" width="12" height="12" rx="2"/></g><text class="ts" x="174.6" y="222" text-anchor="start" dominant-baseline="central">every tick (Rule 1)</text><g class="gray"><rect class="f" x="326.0" y="216" width="12" height="12" rx="2"/></g><text class="ts" x="344.0" y="222" text-anchor="start" dominant-baseline="central">presentation, no Command</text></svg>
